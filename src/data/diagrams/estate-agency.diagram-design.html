<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estate agency · ontology domain model</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: rgb(249 249 249);
      --paper-2: rgb(255 255 255);
      --ink: rgb(44 39 59);
      --muted: rgb(98 93 114);
      --soft: rgb(129 124 144);
      --rule: rgb(227 225 233);
      --rule-solid: rgb(203 200 213);
      --accent: rgb(108 91 212);
      --accent-tint: rgb(238 235 250);
      --link: rgb(91 81 216);
      --font-title: "Roboto Slab", Rockwell, Georgia, serif;
      --font-sans: "DM Sans", Inter, "Segoe UI", Arial, sans-serif;
      --font-mono: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
    }

    body {
      min-height: 100vh;
      padding: 32px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .frame {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.16em;
      line-height: 12px;
      text-transform: uppercase;
    }

    h1 {
      color: var(--ink);
      font-family: var(--font-title);
      font-size: 28px;
      font-weight: 600;
      line-height: 36px;
    }

    .dek {
      max-width: 760px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 20px;
    }

    .diagram-wrap {
      margin-top: 24px;
      overflow-x: auto;
    }

    svg {
      display: block;
      width: 100%;
      min-width: 960px;
      height: auto;
      background: var(--paper);
    }

    .zone {
      fill: var(--paper-2);
      stroke: var(--rule);
      stroke-width: 1;
    }

    .zone-label {
      fill: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .connector {
      fill: none;
      stroke: var(--muted);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.2;
    }

    .connector-accent {
      stroke: var(--accent);
    }

    .relation-mask {
      fill: var(--paper-2);
    }

    .relation-label {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    .relation-label-accent {
      fill: var(--accent);
      font-weight: 600;
    }

    .entity {
      fill: var(--paper-2);
      stroke: var(--ink);
      stroke-width: 1;
    }

    .entity-header {
      fill: var(--paper);
    }

    .entity-focal {
      fill: var(--accent-tint);
      stroke: var(--accent);
      stroke-width: 1.2;
    }

    .entity-header-focal {
      fill: var(--accent-tint);
    }

    .entity-common {
      fill: var(--paper-2);
      stroke: var(--soft);
      stroke-dasharray: 4 4;
      stroke-width: 1;
    }

    .divider {
      stroke: var(--rule-solid);
      stroke-width: 1;
    }

    .entity-tag {
      fill: var(--muted);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .entity-tag-accent {
      fill: var(--accent);
    }

    .entity-name {
      fill: var(--ink);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
    }

    .property-name,
    .property-type,
    .range-label {
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
    }

    .property-name {
      fill: var(--ink);
    }

    .property-type {
      fill: var(--muted);
    }

    .range-chip {
      fill: var(--paper);
      stroke: var(--rule-solid);
      stroke-width: 1;
    }

    .range-label {
      fill: var(--muted);
    }

    .legend-rule {
      stroke: var(--rule-solid);
      stroke-width: 1;
    }

    .legend-label {
      fill: var(--muted);
      font-family: var(--font-sans);
      font-size: 8px;
      font-weight: 600;
    }

    .legend-kicker {
      fill: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.16em;
    }

    .colophon {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--rule);
      color: var(--soft);
      font-family: var(--font-mono);
      font-size: 8px;
      line-height: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="frame">
    <header>
      <p class="eyebrow">OPDA · ontology domain model</p>
      <h1>Estate agency</h1>
      <p class="dek">Classes, object properties, and typed concept or datatype properties in the estate-agency semantic home.</p>
    </header>

    <figure class="diagram-wrap">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="estate-agency.diagram-design-title estate-agency.diagram-design-desc">
        <title id="estate-agency.diagram-design-title">Estate agency ontology domain model</title>
        <desc id="estate-agency.diagram-design-desc">ER data model showing seven estate-agency and common classes, five object-property relationships, seven typed property rows, three unlinked standard range labels, and the asserted consumer-protection subclass relation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" viewBox="0 0 8 8">
            <polygon points="0 0, 8 4, 0 8" fill="var(--muted)"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" viewBox="0 0 8 8">
            <polygon points="0 0, 8 4, 0 8" fill="var(--accent)"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" viewBox="0 0 8 8">
            <polygon points="0 0, 8 4, 0 8" fill="var(--link)"/>
          </marker>
        </defs>

        <rect x="0" y="0" width="1280" height="720" fill="var(--paper)"/>

        <!-- Zones: all faithful-detail resources belong to one of these three semantic homes. -->
        <rect class="zone" x="280" y="40" width="960" height="536" rx="4"/>
        <text class="zone-label" x="296" y="60">Estate agency · semantic home</text>

        <rect class="zone" x="40" y="256" width="200" height="144" rx="4"/>
        <text class="zone-label" x="56" y="276">Common ontology boundary</text>

        <rect class="zone" x="40" y="440" width="200" height="136" rx="4"/>
        <text class="zone-label" x="56" y="460">Referenced range types · unlinked</text>

        <!-- Connectors: five object properties plus the asserted subclass relation. -->
        <line class="connector" x1="216" y1="328" x2="488" y2="328" marker-end="url(#arrow)"/>
        <line class="connector" x1="536" y1="296" x2="536" y2="208" marker-end="url(#arrow)"/>
        <path class="connector" d="M 640 296 V 256 Q 640 248 648 248 H 816 Q 824 248 824 240 V 208" marker-end="url(#arrow)"/>
        <line class="connector" x1="728" y1="328" x2="980" y2="328" marker-end="url(#arrow)"/>
        <path class="connector" d="M 640 360 V 392 Q 640 400 648 400 H 816 Q 824 400 824 408 V 440" marker-end="url(#arrow)"/>
        <path class="connector connector-accent" d="M 1096 112 V 80 Q 1096 72 1088 72 H 832 Q 824 72 824 80 V 96" marker-end="url(#arrow-accent)"/>

        <!-- Opaque relationship labels, each held clear of its connector. -->
        <rect class="relation-mask" x="320" y="308" width="64" height="12" rx="4"/>
        <text class="relation-label" x="352" y="316" text-anchor="middle">has listing</text>

        <rect class="relation-mask" x="548" y="244" width="96" height="12" rx="4"/>
        <text class="relation-label" x="596" y="252" text-anchor="middle">has letting terms</text>

        <rect class="relation-mask" x="676" y="228" width="112" height="12" rx="4"/>
        <text class="relation-label" x="732" y="236" text-anchor="middle">has market disclosure</text>

        <rect class="relation-mask" x="804" y="308" width="104" height="12" rx="4"/>
        <text class="relation-label" x="856" y="316" text-anchor="middle">has media resource</text>

        <rect class="relation-mask" x="680" y="380" width="104" height="12" rx="4"/>
        <text class="relation-label" x="732" y="388" text-anchor="middle">has price statement</text>

        <rect class="relation-mask" x="928" y="52" width="64" height="12" rx="4"/>
        <text class="relation-label relation-label-accent" x="960" y="60" text-anchor="middle">subclass of</text>

        <!-- Common class boundary: Property. -->
        <g aria-label="Property class in the Common ontology boundary">
          <rect class="entity-common" x="64" y="296" width="152" height="64" rx="4"/>
          <text class="entity-tag" x="80" y="312">Class · Common</text>
          <text class="entity-name" x="80" y="336">Property</text>
        </g>

        <!-- Estate-agency classes. -->
        <g aria-label="Letting terms class with rent amount and rent frequency properties">
          <rect class="entity" x="304" y="96" width="256" height="112" rx="4"/>
          <rect class="entity-header" x="304" y="96" width="256" height="48" rx="4"/>
          <rect class="entity-header" x="304" y="136" width="256" height="8"/>
          <line class="divider" x1="304" y1="144" x2="560" y2="144"/>
          <text class="entity-tag" x="320" y="112">Class</text>
          <text class="entity-name" x="320" y="132">Letting terms</text>
          <text class="property-name" x="320" y="168">rent amount</text>
          <text class="property-type" x="544" y="168" text-anchor="end">xsd:decimal</text>
          <text class="property-name" x="320" y="192">rent frequency</text>
          <text class="property-type" x="544" y="192" text-anchor="end">skos:Concept</text>
        </g>

        <g aria-label="Market disclosure class with outcome and type concept properties">
          <rect class="entity" x="704" y="96" width="240" height="112" rx="4"/>
          <rect class="entity-header" x="704" y="96" width="240" height="48" rx="4"/>
          <rect class="entity-header" x="704" y="136" width="240" height="8"/>
          <line class="divider" x1="704" y1="144" x2="944" y2="144"/>
          <text class="entity-tag" x="720" y="112">Class</text>
          <text class="entity-name" x="720" y="132">Market disclosure</text>
          <text class="property-name" x="720" y="168">market disclosure outcome</text>
          <text class="property-type" x="928" y="168" text-anchor="end">skos:Concept</text>
          <text class="property-name" x="720" y="192">market disclosure type</text>
          <text class="property-type" x="928" y="192" text-anchor="end">skos:Concept</text>
        </g>

        <g aria-label="Consumer protection declaration class">
          <rect class="entity" x="980" y="112" width="228" height="80" rx="4"/>
          <text class="entity-tag" x="996" y="128">Class</text>
          <text class="entity-name" x="996" y="152">Consumer protection</text>
          <text class="entity-name" x="996" y="168">declaration</text>
        </g>

        <g aria-label="Property listing class and focal relationship hub">
          <rect class="entity-focal" x="488" y="296" width="240" height="64" rx="4"/>
          <text class="entity-tag entity-tag-accent" x="504" y="312">Class · focal</text>
          <text class="entity-name" x="504" y="336">Property listing</text>
        </g>

        <g aria-label="Listing media resource class with media URL property">
          <rect class="entity" x="980" y="284" width="228" height="88" rx="4"/>
          <rect class="entity-header" x="980" y="284" width="228" height="48" rx="4"/>
          <rect class="entity-header" x="980" y="324" width="228" height="8"/>
          <line class="divider" x1="980" y1="332" x2="1208" y2="332"/>
          <text class="entity-tag" x="996" y="300">Class</text>
          <text class="entity-name" x="996" y="320">Listing media resource</text>
          <text class="property-name" x="996" y="356">media URL</text>
          <text class="property-type" x="1192" y="356" text-anchor="end">xsd:anyURI</text>
        </g>

        <g aria-label="Price statement class with price amount and qualifier properties">
          <rect class="entity" x="704" y="440" width="240" height="112" rx="4"/>
          <rect class="entity-header" x="704" y="440" width="240" height="48" rx="4"/>
          <rect class="entity-header" x="704" y="480" width="240" height="8"/>
          <line class="divider" x1="704" y1="488" x2="944" y2="488"/>
          <text class="entity-tag" x="720" y="456">Class</text>
          <text class="entity-name" x="720" y="476">Price statement</text>
          <text class="property-name" x="720" y="512">price amount</text>
          <text class="property-type" x="928" y="512" text-anchor="end">xsd:decimal</text>
          <text class="property-name" x="720" y="536">price qualifier</text>
          <text class="property-type" x="928" y="536" text-anchor="end">skos:Concept</text>
        </g>

        <!-- Three source standard resources retained as unlinked type labels. -->
        <g aria-label="Referenced standard range labels">
          <rect class="range-chip" x="64" y="472" width="152" height="24" rx="4"/>
          <text class="range-label" x="140" y="488" text-anchor="middle">xsd:anyURI</text>
          <rect class="range-chip" x="64" y="504" width="152" height="24" rx="4"/>
          <text class="range-label" x="140" y="520" text-anchor="middle">xsd:decimal</text>
          <rect class="range-chip" x="64" y="536" width="152" height="24" rx="4"/>
          <text class="range-label" x="140" y="552" text-anchor="middle">skos:Concept</text>
        </g>

        <!-- Horizontal legend strip. -->
        <line class="legend-rule" x1="40" y1="640" x2="1240" y2="640"/>
        <text class="legend-kicker" x="40" y="660">Legend</text>

        <rect class="entity-focal" x="40" y="676" width="16" height="12" rx="4"/>
        <text class="legend-label" x="64" y="688">focal class</text>

        <rect class="entity" x="180" y="676" width="16" height="12" rx="4"/>
        <text class="legend-label" x="204" y="688">class</text>

        <rect class="entity-common" x="300" y="676" width="16" height="12" rx="4"/>
        <text class="legend-label" x="324" y="688">common boundary</text>

        <line class="connector" x1="500" y1="684" x2="540" y2="684" marker-end="url(#arrow)"/>
        <text class="legend-label" x="552" y="688">object property</text>

        <line class="connector connector-accent" x1="720" y1="684" x2="760" y2="684" marker-end="url(#arrow-accent)"/>
        <text class="legend-label" x="772" y="688">subclass</text>

        <rect class="range-chip" x="900" y="676" width="24" height="12" rx="4"/>
        <text class="legend-label" x="932" y="688">datatype / concept row</text>

        <rect class="range-chip" x="1120" y="676" width="16" height="12" rx="4"/>
        <text class="legend-label" x="1144" y="688">range label</text>
      </svg>
    </figure>

    <footer class="colophon">ER / data model · doc-wide · faithful · engineer · light</footer>
  </main>
</body>
</html>
