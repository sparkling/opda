schema_version = "0.1"

[[rule]]
id = "local-land-charges"
priority = 360
heading = "localSearches"
path_contains = ".localLandCharges[]."
home = "property-data-services"
roles = ["resource", "relationship", "attribute"]
construct_refs = ["pds:LocalLandCharge", "pds:hasLocalLandCharge", "pds:chargeReference", "pds:registrationDate", "pds:findingDescription"]
disposition = "consolidate"
rationale = "Consolidate charge fields under an identifiable LocalLandCharge resource."

[[rule]]
id = "local-search-planning-application"
priority = 350
heading = "localSearches"
