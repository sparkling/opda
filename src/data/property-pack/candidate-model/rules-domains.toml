roles = ["resource", "relationship", "attribute"]
construct_refs = ["pds:EnergyPerformanceCertificate", "pds:hasEnergyPerformanceCertificate", "pds:certificateAddress"]
disposition = "consolidate"
rationale = "Keep certificate address text as reconciliation evidence on the certificate, not as the current Property address."

[[rule]]
id = "energy-certificate-uprn"
priority = 360
heading = "energyEfficiency"
field_name = "uprn"
home = "property-data-services"
roles = ["resource", "relationship", "attribute", "validation-rule"]
construct_refs = ["pds:EnergyPerformanceCertificate", "pds:hasEnergyPerformanceCertificate", "pds:certificateUprn"]
disposition = "challenge"
rationale = "Use the certificate UPRN for reconciliation with common Property identity and challenge the legacy numeric datatype."

[[rule]]
