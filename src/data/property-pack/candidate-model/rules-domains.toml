construct_refs = ["pds:EnergyPerformanceCertificate", "pds:hasEnergyPerformanceCertificate", "pds:energyRating", "pds:certificateAddress", "pds:certificateUprn", "pds:certificateSupplyStatus"]
disposition = "consolidate"
rationale = "Model certificate fields under an EnergyPerformanceCertificate resource and keep its UPRN as reconciliation evidence."

[[rule]]
id = "energy-rating"
priority = 360
