roles = ["resource", "relationship", "attribute", "controlled-concept"]
construct_refs = ["pds:PlanningApplication", "pds:hasPlanningApplication", "pds:applicationReference", "pds:applicationDate", "pds:applicationType"]
disposition = "consolidate"
rationale = "Represent structured planning records as PlanningApplication resources identified by authority reference."

[[rule]]
id = "local-search-findings"
priority = 250
heading = "localSearches"
home = "property-data-services"
roles = ["resource", "relationship", "controlled-concept"]
construct_refs = ["pds:Search", "pds:SearchFinding", "pds:hasSearchFinding", "pds:findingType", "pds:findingOutcome", "pds:findingDescription"]
disposition = "consolidate"
rationale = "Represent the many local-search questions as typed SearchFinding instances rather than one predicate per form field."

