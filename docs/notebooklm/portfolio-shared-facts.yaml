notebooklm_config_version: 1
config_status: draft
last_updated: 2026-08-31
governing_adr: ADR-0081

bundle:
  id: shared-facts-and-terminology
  title: OPDA shared programme facts and terminology
  purpose: >-
    Supply the minimum versioned cross-portfolio facts needed to keep all six
    notebooks consistent without turning one notebook's synthesis into another's authority.
  output: docs/notebooklm/prepared/shared-facts-and-terminology.md
  manifest_output: docs/notebooklm/prepared/shared-facts-and-terminology.manifest.yaml
  build_status: built-and-verified
  output_sha256: 119d396401f0fb4ae63a8e51d3a723de3d293099dc010c1f68ece97418f1aede

dependencies:
  - id: preparation-builder
    kind: implementation
    target: scripts/build-notebooklm-prepared-sources.mjs
    status: implemented-and-verified
    required_before: bundle-build
    blocking: true
  - id: repository-public-source-authorisation
    kind: operator-decision
    target: repository-corpus
    status: approved
    required_before: bundle-build
    blocking: false
    decision_owner: repository-owner
    criteria: Every repository source is public and authorised for NotebookLM upload without privacy or rights deferral.
    approved_by: repository-owner
    approved_on: 2026-08-31

guardrails:
  - "Build this bundle once; notebook configs reference it and must not redefine it."
  - "This intentional synthesis is not a precedent for merging other notebook sources."
  - "Preserve the status, scope, date and authority of every component source."
  - "Include only cross-portfolio facts; detailed narrative and model content stay in their notebooks."
  - "Do not use PDTF 1.0 or SPDTF 2.0."
  - "Do not call the Property Pack ontology the SPDTF ontology."
  - "Do not convert proposed governance or workflow into current policy."
  - "Do not state that a property Smart Data scheme is enacted or operational unless the cited source establishes it."

canonical_facts:
  - subject: Open Property Data Association
    statement: OPDA is the Open Property Data Association.
    authority: OPDA Constitution 2026 and Articles of Association 2026
  - subject: Smart Property Data Trust Framework
    statement: SPDTF is the Smart Property Data Trust Framework, a future property information standard under development.
    authority: ADR-0081
  - subject: Property Pack ontology
    statement: The Property Pack ontology is an independent delivery being developed as a future component of SPDTF.
    authority: ADR-0075 and ADR-0081
  - subject: Current model scope
    statement: No broader SPDTF ontology exists yet; the current model delivery is the Property Pack ontology.
    authority: ADR-0081
  - subject: PDTF schema
    statement: The PDTF schema is attributed third-party input, not an OPDA-endorsed predecessor standard or current authority for SPDTF meaning.
    authority: ADR-0077 and ADR-0081
  - subject: Government context
    statement: The work sits within UK Smart Data and home-buying-and-selling policy activity; policy intent, consultation, legislation and operational requirements remain distinct.
    authority: selected UK Government sources and ADR-0081
  - subject: Domain authority
    statement: Domain practitioners provide evidence and own meaning within their contextual boundary; AI may assist with reviewable proposals but does not decide meaning.
    authority: ADR-0063 and proposed ADR-0065
  - subject: Prohibited version labels
    statement: Do not use PDTF 1.0 or SPDTF 2.0.
    authority: ADR-0077 and ADR-0081

required_component_metadata:
  - title
  - originator
  - source_date
  - captured_or_updated_date
  - authority
  - maturity
  - original_path_or_url
  - inclusion_reason
  - component_boundary
  - repository_tracking
  - rights_and_data_classification
  - ingest_format
  - size_bytes
  - sha256

sources:
  - id: shared-government-policy
    title: Current government Smart Data and property reform context
    authority: uk-government
    maturity: published-policy-and-open-evidence-gathering
    urls:
      - https://www.gov.uk/government/publications/smart-data-strategy
      - https://www.gov.uk/government/calls-for-evidence/smart-data-multi-sector-call-for-evidence
      - https://www.gov.uk/government/consultations/home-buying-and-selling-reform/outcome/home-buying-and-selling-reform-roadmap
    inclusion_reason: Ground the government programme, legislation context and dates.
    repository_tracking: external
    rights_and_data_classification: public-and-authorised-for-notebooklm

  - id: shared-programme-decisions
    title: OPDA programme, model and lineage decisions
    authority: opda-decision-record
    maturity: mixed-status-preserve-front-matter
    inputs:
      - docs/adr/ADR-0062-dbt-smart-data-implications-for-spdtf-and-pdtf-schema-lineage.md
      - docs/adr/ADR-0063-domain-led-bounded-context-working-groups.md
      - docs/adr/ADR-0065-ai-assisted-evidence-to-model-workflow.md
      - docs/adr/ADR-0066-property-pack-451-seed-scope-and-greenfield-ontology.md
      - docs/adr/ADR-0067-first-principles-property-pack-ontology-by-bounded-context.md
      - docs/adr/ADR-0068-govern-opda-standards-lifecycle.md
      - docs/adr/ADR-0069-public-working-group-recruitment-and-signup.md
      - docs/adr/ADR-0070-uniform-microsoft-365-working-group-workspaces.md
      - docs/adr/ADR-0075-property-pack-ontology-as-accelerated-spdtf-component.md
      - docs/adr/ADR-0077-place-pdtf-schema-beneath-spdtf-as-third-party-input.md
    inclusion_reason: Establish accepted, proposed and historical relationships consistently.
    repository_tracking: tracked
    rights_and_data_classification: public-and-authorised-for-notebooklm

  - id: shared-opda-role
    title: OPDA identity and organisational role
    authority: opda-corporate
    maturity: operative-at-document-date
    inputs:
      - source/01-organisation/constitution-and-policies/OPDA Constitution 2026.pdf
      - source/01-organisation/constitution-and-policies/Articles of Association 2026.pdf
    inclusion_reason: Ground OPDA's corporate identity without importing full governance detail.
    repository_tracking: ignored-local-public-corpus
    rights_and_data_classification: public-and-authorised-for-notebooklm

  - id: shared-current-workspace
    title: Current contextual-boundary and working-group names
    authority: opda-maintained-implementation-data
    maturity: current-at-build-date
    inputs:
      - src/lib/spdtf-workspace.mjs
      - src/components/ia/working-groups.ts
    inclusion_reason: Keep names and boundary types consistent across notebooks.
    repository_tracking: tracked
    rights_and_data_classification: public-and-authorised-for-notebooklm

transformation:
  operation: extract-status-qualified-cross-portfolio-facts-to-markdown
  reproducibility: deterministic-from-accepted-adr-and-config
  builder: scripts/build-notebooklm-prepared-sources.mjs
  requirements:
    - Record full name, definition, role, authority, maturity and citation for every term.
    - Record event date, publication date and retrieval date separately.
    - Preserve contradictions in a dedicated section rather than choosing by recency alone.
    - Include a prohibited-formulations table and an unresolved-facts table.
    - Record 2030 and 2035 statements as separate sourced rows with distinct scope and status.
    - Put the strategy-overview property-scheme deadline wording in the unresolved-facts table.
    - Emit the component manifest and bundle checksum before ingestion.

known_conflicts:
  - id: shared-2030-property-scheme-claim
    claim_source: src/pages/strategy/strategy-overview.astro
    issue: >-
      The OPDA page states that the property scheme must be operational by 2030.
      The selected government sources instead require separate treatment of Smart
      Data 2035, 2030 register-modernisation intent and proposals subject to later
      legislation or consultation.
    disposition: unresolved-requires-human-approved-wording

validation:
  status: passed
  required_checks:
    - Every factual statement has a component citation.
    - Proposed ADRs remain labelled proposed.
    - Property Pack, PDTF schema, PDTF-derived ontology and SPDTF remain distinct.
    - Government intent, consultation, legislation and implemented requirements remain distinct.
    - All six notebook configs reference this output path and this owner.
