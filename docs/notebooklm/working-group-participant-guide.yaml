preparation_prompts:
  - id: WG-01
    title: Audit participant guidance and operating evidence
    source_scope: [wg-shared-facts, wg-member-guide-site, wg-review-surface, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-operating-decisions, wg-operating-materials, wg-participation-method]
    depends_on: []
    output_note: "WG-01 — Participant guidance source audit"
    prompt: >-
      Audit every source for issuer, date, authority, currentness, intended audience,
      operational status and privacy or access constraints. Distinguish implemented
      participant routes, accepted operating decisions, proposed workflow and
      recruitment messaging. Identify contradictions and missing evidence; cite all findings.
    acceptance:
      - Implemented, accepted, proposed and promotional content are distinct.
      - Personal-data and access risks are explicit.
      - Every conclusion is cited.

  - id: WG-02
    title: Establish why different participants should contribute
    source_scope: [wg-shared-facts, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-participation-method]
    depends_on: [WG-01]
    output_note: "WG-02 — Participation motives and value evidence"
    prompt: >-
      Build an evidence matrix for why domain experts, commercial organisations,
      public-interest representatives, regulators, implementers and affected groups
      may want to participate. Record the contribution each can make, the influence
      genuinely available, limits on that influence, expected benefit and citation.
      Avoid generic marketing claims and do not promise an outcome.
    acceptance:
      - Commercial and public interests are both represented.
      - Influence is described within evidenced governance limits.
      - Benefits and caveats are cited.

  - id: WG-03
    title: Define participant contributions in plain language
    source_scope: [wg-member-guide-site, wg-review-surface, wg-kickoff-presentation, wg-operating-decisions, wg-participation-method]
    depends_on: [WG-01, WG-02]
    output_note: "WG-03 — Contribution types and examples"
    prompt: >-
      Create a plain-language catalogue of useful contributions: sources, terminology,
      scenarios, exceptions, rules, harms, commercial needs, public-interest needs,
      implementation constraints, mappings and review comments. For each give an
      example, where it is submitted, how it is handled and what it does not decide.
    acceptance:
      - Actions use parallel, comprehensible language.
      - No ontology knowledge is assumed.
      - Submission and decision authority are not conflated.

  - id: WG-04
    title: Map the participant journey and channels
    source_scope: [wg-member-guide-site, wg-review-surface, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-operating-decisions, wg-operating-materials]
    depends_on: [WG-01, WG-03]
    output_note: "WG-04 — Participant journey and channel map"
    prompt: >-
      Map the participant journey from registration through onboarding, meetings,
      Teams discussion, SharePoint evidence submission, candidate review, feedback,
      decision records and continued participation. For every step show the channel,
      owner, expected action, evidence produced, access rule and whether it is
      implemented, accepted, proposed or missing.
    acceptance:
      - Unsupported logistics are marked missing rather than invented.
      - Teams and SharePoint roles follow accepted evidence.
      - Access and record ownership are explicit.

  - id: WG-05
    title: Prepare evidence-handling and privacy guidance
    source_scope: [wg-member-guide-site, wg-recruitment-and-privacy, wg-operating-decisions, wg-operating-materials]
    depends_on: [WG-01, WG-04]
    output_note: "WG-05 — Evidence handling, privacy and publication controls"
    prompt: >-
      Build a participant-facing control matrix for source classification, permissions,
      personal data, confidential material, recording consent, retention, SharePoint
      access, quotation, model provenance and public publication. Separate current
      rules, proposed controls and unanswered questions. Do not advise participants
      to submit restricted material where a handling route is unconfirmed.
    acceptance:
      - Access, processing and publication are separate controls.
      - Unknown routes are marked unresolved.
      - Every current rule is cited.

  - id: WG-06
    title: Explain review, iteration and the role of AI
    source_scope: [wg-review-surface, wg-kickoff-presentation, wg-operating-decisions, wg-participation-method]
    depends_on: [WG-03, WG-04, WG-05]
    output_note: "WG-06 — Model review and AI responsibility matrix"
    prompt: >-
      Explain how participant evidence may be turned into a model candidate, how
      participants review definitions, diagrams, examples, mappings and questions,
      how comments are traced, and what happens in another iteration. Separate human
      authority, facilitator work, AI assistance and automated checks. Mark proposed
      stages and unresolved maturity decisions.
    acceptance:
      - AI never owns meaning or approval.
      - Reviewable outputs are understandable without ontology expertise.
      - Proposed lifecycle steps remain visibly proposed.

  - id: WG-07
    title: Build grounded participant questions and answers
    source_scope: [wg-member-guide-site, wg-review-surface, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-operating-decisions, wg-operating-materials, wg-participation-method]
    depends_on: [WG-02, WG-03, WG-04, WG-05, WG-06]
    output_note: "WG-07 — Participant questions, answers and evidence gaps"
    prompt: >-
      Produce a question-and-answer evidence matrix covering eligibility, time
      commitment, commercial interests, public interests, accessibility, meeting
      format, source submission, confidentiality, AI, model review, decision rights,
      feedback and withdrawal. Give a cited answer where evidence exists and label
      every unanswered question for programme resolution.
    acceptance:
      - Questions cover both prospective and active members.
      - Unknown answers are not guessed.
      - Answers are plain language and cited.

  - id: WG-08
    title: Challenge the participant experience
    source_scope: [wg-shared-facts, wg-member-guide-site, wg-review-surface, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-operating-decisions, wg-operating-materials, wg-participation-method]
    depends_on: [WG-04, WG-05, WG-06, WG-07]
    output_note: "WG-08 — Participant experience adversarial review"
    prompt: >-
      Act as a sceptical prospective participant from several viewpoints. Identify
      unclear commitments, internal jargon, inaccessible assumptions, tokenistic
      participation, hidden commercial or public-interest conflicts, unimplemented
      promises, privacy risks and places where the process asks for expertise without
      showing influence. Propose sourced corrections or explicit open questions.
    acceptance:
      - Findings distinguish content defects from missing programme decisions.
      - Commercial, public-interest and accessibility perspectives are included.
      - Corrections preserve governance truth.

  - id: WG-09
    title: Assemble the artefact preparation pack
    source_scope: [wg-shared-facts, wg-member-guide-site, wg-review-surface, wg-recruitment-and-privacy, wg-kickoff-presentation, wg-operating-decisions, wg-operating-materials, wg-participation-method]
    depends_on: [WG-02, WG-03, WG-04, WG-05, WG-06, WG-07, WG-08]
    output_note: "WG-09 — Participant evidence pack — human review pending"
    prompt: >-
      Assemble a format-neutral preparation pack containing participation motives,
      contribution catalogue, participant journey, channel map, evidence-handling
      controls, human and AI responsibilities, grounded questions and answers,
      accessibility considerations, caveats, open decisions and citation index.
      Do not generate a presentation, handbook, infographic, audio or video.
    acceptance:
      - Every reusable claim is cited and status-qualified.
      - Unsupported promises are removed or labelled unresolved.
      - The output is preparation data, not a finished artefact.

  - id: WG-10
    title: Close the participant journey through publication and maintenance
    source_scope: [wg-shared-facts, wg-member-guide-site, wg-review-surface, wg-operating-decisions, wg-canonical-status-data, wg-participation-method]
    depends_on: [WG-04, WG-05, WG-06, WG-09]
    output_note: "WG-10 — Publication and post-release participant journey — human review pending"
    prompt: >-
      Extend the contributor journey from candidate review through issue disposition,
      working-group decisions, public review, implementation evidence, ratification,
      immutable release, post-release feedback, errata, change control, systematic
      review, supersession and withdrawal. Use separate lanes for external contributors,
      members, facilitators, chairs, editors, the Standards Secretariat, reviewers and
      the Board or Executive Committee. At each stage record the action, channel and
      system of record, accountable human, decision authority, evidence, access or
      publication boundary, exit criterion, implementation state and route back into
      iteration. Distinguish a website candidate, maturity transition and normative
      release. Mark proposed or missing routes and do not invent an operative public
      feedback channel. Finish with the corrections needed in WG-09; create no final artefact.
    acceptance:
      - Candidate publication, public review, ratification, release and maintenance are distinct.
      - Participant actions remain separate from human decision authority.
      - The feedback loop continues after release without invented channels or timings.
      - Every claim is cited and current, proposed and missing states remain visible.

execution_and_review:
  execution_log: docs/notebooklm/receipts/working-group-participant-guide.jsonl
  run_order: [WG-01, WG-02, WG-03, WG-04, WG-05, WG-06, WG-07, WG-08, WG-09, WG-10]
  record_each_run: [event, run_fingerprint, prompt_id, prompt_version, recorded_at, selected_stable_source_ids, selected_notebook_source_ids, dependency_prompt_ids, dependency_output_sha256, dependency_notebook_source_ids, dependency_transport, conversation_id, notebook_note_id, notebook_derived_source_id, output_path, output_sha256, citation_count, citation_review, response_quality_review, authority_review, findings, status]
  derived_output_policy: >-
    Prompt responses are derived preparation notes, not operating policy or participant
    commitments. They must retain citations and may not be re-ingested without a
    visible derived label and human approval.
  private_draft_generation:
    status: authorised-by-repository-owner
    authorised_on: 2026-08-31
    formats: [cinematic, explainer, short]
    publication_status: blocked-pending-human-review
  artefact_generation_gate:
    status: blocked
    approval: {status: pending, approved_by: null, approved_on: null}
    unlock_when:
      - All preparation prompts have completed in order.
      - Every output note has passed citation, authority, privacy and accessibility review.
      - Operational gaps and unresolved participant questions remain visible.
      - The gate approval records an approving human and date.
