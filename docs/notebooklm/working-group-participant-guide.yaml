governing_adr: ADR-0081

notebook:
  id: d96c56b9-ba99-489f-aa29-51e820b4713d
  title: "OPDA — Working-Group Participant Guide"
  portfolio: programme-and-participation
  purpose: >-
    Prepare participant-facing information about why to join, what members contribute,
    how groups work, how evidence is handled and how people review model candidates.
  primary_audiences:
    - prospective participants
    - current working-group members
    - chairs and facilitators
    - domain and public-interest representatives
  target_artefacts:
    - participant induction presentation
    - working-group onboarding video
    - contribution journey infographic
    - participant handbook and frequently asked questions

workspace:
  profile: personal
  sharing: private
  notebook_id_verification: {status: verified, profile: personal, verified_at: 2026-08-31}
  source_ingestion_status: completed-and-verified
  preparation_prompt_status: completed-and-automated-review-recorded

dependencies:
  - id: shared-facts-pack
    kind: config-output
    target: docs/notebooklm/prepared/shared-facts-and-terminology.md
    status: built-and-verified
    required_before: source-ingestion
    blocking: true
  - id: source-manifest-approval
    kind: technical-quality-gate
    target: resource_manifest
    status: approved
    required_before: source-ingestion
    blocking: false
  - id: repository-public-source-authorisation
    kind: operator-decision
    target: repository-corpus
    status: approved
    required_before: source-ingestion
    blocking: false
    decision_owner: repository-owner
    criteria: Every repository source is public and authorised for NotebookLM upload without privacy or rights deferral.
    approved_by: repository-owner
    approved_on: 2026-08-31
  - id: preparation-builder-and-source-conversions
    kind: implementation-and-output
    target: scripts/build-notebooklm-prepared-sources.mjs
    status: implemented-and-verified
    required_before: source-ingestion
    blocking: true

guardrails:
  - "Write for industry and subject-matter experts, not ontology specialists."
  - "Participants contribute practical evidence, judgement, exceptions and review."
  - "Do not promise a meeting cadence, intake route, discussion feature or decision mechanism unless implemented evidence supports it."
  - "Microsoft Teams is the discussion hub and SharePoint is the governed evidence store under ADR-0070."
  - "AI may organise and draft proposals; people retain authority for meaning and decisions."
  - "Do not describe the proposed standards lifecycle in ADR-0068 as operative."
  - "Treat access, confidentiality, personal data, consent and publication as separate controls."

prompt_defaults:
  prompt_version: 2
  note_carry_forward: select-derived-preparation-output-sources
  instruction_prefix: >-
    Use only selected sources and NotebookLM source citations for every substantive claim; separate source status, date, scope and implementation state, and preserve conflicts.
    Expand SPDTF only as Smart Property Data Trust Framework. The Property Pack ontology is an independent delivery intended as a future SPDTF component; never call it the SPDTF ontology.
    Treat the PDTF schema only as attributed third-party input. Do not use numbered PDTF or SPDTF version labels. Do not turn a 2030 policy objective into enacted law or a mandatory rollout.
    Distinguish six property-domain working groups, one scheme group and one interoperability group. For depends_on, use the selected derived preparation-output sources and begin with a Dependency Use Register copying every supplied prompt ID and SHA-256 exactly.
    Derived outputs are non-authoritative working data; substantive claims must still cite primary sources. Never claim dependency context is unavailable.
    This repository corpus is publicly authorised for this use. Produce only the requested structured preparation output, with no follow-up offers, questions or publication artefacts.

resource_manifest:
  status: approved
  review_required_before_ingestion: false
  ingestion_log: docs/notebooklm/receipts/working-group-participant-guide.jsonl
  required_metadata_before_ingestion:
    - stable_source_id
    - title
    - originator
    - source_date
    - authority
    - maturity
    - repository_tracking
    - rights_and_data_classification
    - ingest_format
    - size_bytes
    - original_path_or_url
    - inclusion_reason
    - sha256
  availability_policy: >-
    Repository tracking is resolved per input with git ls-files, never inferred from
    its top-level directory. Any absent local input fails closed. Each file, URL,
    transcript and rendered route remains a separate source by default.
  prepared_source_contract:
    builder: scripts/build-notebooklm-prepared-sources.mjs
    builder_status: implemented-and-verified
    notebook_source_limit: 500
    default_source_unit: one-file-url-transcript-or-rendered-route
    combination_policy: only-for-demonstrated-format-need-or-when-discrete-sources-exceed-500
    website_prerequisite: make build-data
    manifest_required: true
    output_sha256_required: true
  selection_rule: >-
    Prefer current participant guidance and accepted operating decisions. Treat
    recruitment copy as messaging evidence, not proof that an operating process exists.
