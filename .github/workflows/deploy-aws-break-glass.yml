name: Break-glass deploy site to AWS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aws-break-glass.yml'
  workflow_dispatch:
    inputs:
      confirm_release:
        description: Confirm an unvalidated production release
        required: true
        type: boolean
        default: false

concurrency:
  group: opda-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy without release gates
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_release) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[break-glass-release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build site from committed inputs
        run: pnpm run build

      - name: Record mutable-object hashes and cache policies
        run: node scripts/site-cache-release.mjs manifest dist

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OPDA_SITE_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Publish immutable assets then changed mutable objects
        run: |
          set -euo pipefail
          SITE_BUCKET=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-site \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-site \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          # Emergency publication skips its existing release gates, not the
          # cache-safety guarantees needed by open pages and later releases.
          for ASSET_PREFIX in _astro _images _ui; do
            if [ -d "dist/$ASSET_PREFIX" ]; then
              aws s3 sync "dist/$ASSET_PREFIX/" "s3://$SITE_BUCKET/$ASSET_PREFIX/" \
                --size-only --only-show-errors --cache-control 'public,max-age=31536000,immutable'
            fi
          done
          node scripts/site-cache-release.mjs deploy dist "$SITE_BUCKET" "$DISTRIBUTION_ID"
