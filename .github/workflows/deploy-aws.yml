name: Validate and deploy site to AWS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/manual/**'
      - 'docs/ontology/odr/**'
      - 'docs/adr/**'
      - 'source/_content/**'
      - 'source/_examples/**'
      - 'source/00-deliverables/semantic-models/provenance-map.yaml'
      - 'source/00-deliverables/semantic-models/theme-map.yaml'
      - 'source/03-standards/ontology/**'
      - 'source/03-standards/ontology-candidates/**'
      - 'config/fuseki-config.ttl'
      - 'config/property-pack-candidate/**'
      - 'tools/opda-gen/**'
      - 'scripts/**'
      - '!scripts/*notebooklm*'
      - '!scripts/notebooklm/**'
      - 'astro.config.mjs'
      - 'playwright.config.mjs'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/deploy-aws.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'docs/manual/**'
      - 'docs/ontology/odr/**'
      - 'docs/adr/**'
      - 'source/_content/**'
      - 'source/_examples/**'
      - 'source/00-deliverables/semantic-models/provenance-map.yaml'
      - 'source/00-deliverables/semantic-models/theme-map.yaml'
      - 'source/03-standards/ontology/**'
      - 'source/03-standards/ontology-candidates/**'
      - 'config/fuseki-config.ttl'
      - 'config/property-pack-candidate/**'
      - 'tools/opda-gen/**'
      - 'scripts/**'
      - '!scripts/*notebooklm*'
      - '!scripts/notebooklm/**'
      - 'tests/**'
      - 'DESIGN.md'
      - 'astro.config.mjs'
      - 'playwright.config.mjs'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

concurrency:
  group: opda-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  validate-build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine whether model gates are required
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "model=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" "$GITHUB_SHA" > /tmp/opda-changed-paths
          if grep -Eq '^(\.github/workflows/deploy-aws\.yml$|Makefile$|package\.json$|pnpm-lock\.yaml$|tools/opda-gen/|src/data/ontology-model\.json$|public/data/ontology-graph-elements\.json$|source/(03-standards/ontology|03-standards/ontology-candidates|_content|_examples)/|source/00-deliverables/semantic-models/(provenance-map|theme-map)\.yaml$|config/(fuseki-config\.ttl|property-pack-candidate/)|scripts/(build-with-data|fuseki-load|ontology-model|ontology-graph|property_pack|check-schema-reproducibility)\.|tests/(baspi5_round_trip/|property-pack-(catalogue|candidate)))' /tmp/opda-changed-paths; then
            echo "model=true" >> "$GITHUB_OUTPUT"
          else
            echo "model=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        if: steps.changes.outputs.model == 'true'
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        if: steps.changes.outputs.model == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Apache Jena distributions
        if: steps.changes.outputs.model == 'true'
        uses: actions/cache@v6
        with:
          path: |
            .jena
            .fuseki
          key: jena-fuseki-6.1.0-${{ runner.arch }}

      - name: Fetch pinned PDTF schemas
        if: steps.changes.outputs.model == 'true'
        run: |
          git clone --quiet https://github.com/Property-Data-Trust-Framework/schemas.git source/03-standards/schemas
          git -C source/03-standards/schemas checkout --quiet 996a56adc297e762bbee935a9ae2883df791e1d4

      - name: Install ontology toolchain
        if: steps.changes.outputs.model == 'true'
        working-directory: tools/opda-gen
        run: pip install -e .[dev] jinja2==3.1.6

      - name: Provision Apache Jena
        if: steps.changes.outputs.model == 'true'
        run: python -c "from opda_gen.jena_shacl import resolve_jena_shacl; print(resolve_jena_shacl())"

      - run: pnpm install --frozen-lockfile

      - name: Design-system drift gate
        run: pnpm run check:design-system

      - name: ADR registry drift gate
        run: make check-adr

      - name: Node contracts
        run: pnpm test

      - name: Ontology documentation drift gate
        run: make ci-ontology-doc ci-ontology-graph

      - name: Ontology generation contracts
        if: steps.changes.outputs.model == 'true'
        run: make ci-ontology

      - name: Schema reproducibility contracts
        if: steps.changes.outputs.model == 'true'
        run: pnpm run test:schema && pnpm run check:schema-drift

      - name: Build site from the committed model
        if: steps.changes.outputs.model != 'true'
        run: pnpm run build

      - name: Refresh model and build site
        if: steps.changes.outputs.model == 'true'
        run: pnpm run build:data

      - name: Generated model drift gate
        if: steps.changes.outputs.model == 'true'
        run: git diff --exit-code -- src/data/ontology-model.json public/data/ontology-graph-elements.json

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Built-route and resource gates
        run: pnpm run check:routes && pnpm run check:resource-links

      - name: Browser, accessibility and responsive gates
        run: pnpm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Assume deploy role (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OPDA_SITE_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Sync dist to the site bucket
        if: github.event_name != 'pull_request'
        run: |
          SITE_BUCKET=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-site \
            --query "Stacks[0].Outputs[?OutputKey=='SiteBucketName'].OutputValue" --output text)
          aws s3 sync dist/ "s3://$SITE_BUCKET" --delete \
            --exclude "spdtf/inputs/pdtf-schema/schema-derived-ontology/use-and-tooling/artefacts/*" \
            --exclude "spdtf/inputs/pdtf-schema/schema-derived-ontology/use-and-tooling/tools/ontospy/*" \
            --exclude "spdtf/inputs/pdtf-schema/schema-derived-ontology/use-and-tooling/tools/pylode/*" \
            --exclude "spdtf/inputs/pdtf-schema/schema-derived-ontology/use-and-tooling/tools/shaclplay/*" \
            --exclude "spdtf/inputs/pdtf-schema/schema-derived-ontology/use-and-tooling/tools/widoco/*"

      - name: Invalidate CloudFront
        if: github.event_name != 'pull_request'
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-site \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths '/*'
