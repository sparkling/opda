name: Validate and deploy site to AWS

on:
  push:
    branches: [main]
    paths: &site_paths
      - 'src/**'
      - 'public/**'
      - 'docs/manual/**'
      - 'docs/ontology/odr/**'
      - 'docs/adr/**'
      - 'source/_content/**'
      - 'source/_examples/**'
      - 'source/00-deliverables/semantic-models/provenance-map.yaml'
      - 'source/00-deliverables/semantic-models/theme-map.yaml'
      - 'source/03-standards/ontology/**'
      - 'source/03-standards/ontology-candidates/**'
      - 'config/fuseki-config.ttl'
      - 'config/property-pack-candidate/**'
      - 'config/ci-test-tiers.json'
      - 'tools/opda-gen/**'
      - 'scripts/**'
      - '!scripts/*notebooklm*'
      - '!scripts/notebooklm/**'
      - 'tests/**'
      - 'DESIGN.md'
      - 'astro.config.mjs'
      - 'playwright.config.mjs'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - '.github/workflows/deploy-aws.yml'
      - '.github/workflows/site-release.yml'
      - '.github/workflows/site-assurance.yml'
  pull_request:
    paths: *site_paths
  workflow_dispatch:
    inputs:
      full_model_validation:
        description: Run the ontology generator and full model gates
        required: true
        default: false
        type: boolean
      force_site_build:
        description: Rebuild and publish the committed static site only
        required: true
        default: false
        type: boolean

concurrency:
  group: opda-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/site-release.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      deploy: ${{ github.event_name != 'pull_request' }}
      full_model_validation: ${{ inputs.full_model_validation || false }}
      force_site_build: ${{ inputs.force_site_build || false }}
    secrets: inherit
