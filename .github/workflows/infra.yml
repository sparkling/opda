name: Infrastructure (CloudFormation)

# Infra CI/CD per ADR-0040 §3: validates and deploys the CloudFormation stacks
# in dependency order — certificate discovery/bootstrap (us-east-1) → regional
# artifacts + site (eu-west-2) → certificate-only edge reconciliation. The site
# update comes before removal of the former Lambda@Edge resources so CloudFront
# first drops every viewer-request association (ADR-0079). Change-set based and
# idempotent (--no-fail-on-empty-changeset), so a run that touches only one
# stack is a no-op for the others.
#
# The bootstrap stack (config/aws/bootstrap-stack.yaml) is deliberately NOT
# deployed here — it creates the very role this workflow assumes (ADR-0040).
#
# Auth: GitHub OIDC → opda-site-deploy role; no static AWS keys (ADR-0040 §1).
# Repository configuration required:
#   vars.OPDA_SITE_DEPLOY_ROLE_ARN — from the bootstrap stack outputs
# Cognito client and store configuration come from CloudFormation exports.

on:
  push:
    branches: [main]
    paths:
      - 'config/aws/**'
      - '.github/workflows/infra.yml'
      - 'tests/hubspot-approval-*.test.mjs'
      - 'tests/auth-session.test.mjs'
      - 'tests/hubspot-sync.test.mjs'
      - 'src/approval-onboarding/**'
      - 'src/agents/working-group-inbox/domain.mjs'
      - 'scripts/package-approval-onboarding.mjs'
      - 'docs/templates/assets/opda-email-logo.png'
      - 'tests/approval-onboarding-*.test.mjs'
  # Manual escape hatch, and the sequencing tool for the rare coupled case
  # (infra change that replaces the site bucket/distribution → run this, then
  # the site deploy) — ADR-0040 §5.
  workflow_dispatch:

# Two infra runs must never interleave change sets (ADR-0040 §3).
concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test participant approval boundary
        run: node --test tests/hubspot-approval-*.test.mjs tests/auth-session.test.mjs tests/hubspot-sync.test.mjs tests/approval-onboarding-*.test.mjs

      - name: Package bounded onboarding runtime locally
        run: node scripts/package-approval-onboarding.mjs

      - name: Lint templates
        run: |
          pipx install cfn-lint
          cfn-lint config/aws/*.yaml

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OPDA_SITE_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Validate templates
        run: |
          for t in config/aws/*.yaml; do
            aws cloudformation validate-template --region eu-west-2 \
              --template-body "file://$t" --query Description --output text
          done

      # On an established installation, read the existing certificate without
      # updating the old edge stack yet: its obsolete Lambda resources must not
      # be deleted until the site distribution has removed their associations.
      # On a clean installation, create the certificate-only stack first.
      - name: Read or create certificate stack (us-east-1)
        run: |
          if ! aws cloudformation describe-stacks --region us-east-1 \
            --stack-name opda-edge >/dev/null 2>&1; then
            HOSTED_ZONE_ID=$(aws cloudformation describe-stacks --region eu-west-2 \
              --stack-name opda-bootstrap \
              --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" --output text)
            aws cloudformation deploy --region us-east-1 \
              --stack-name opda-edge \
              --template-file config/aws/edge-stack.yaml \
              --no-fail-on-empty-changeset \
              --parameter-overrides HostedZoneId="$HOSTED_ZONE_ID"
          fi
          CERT_ARN=$(aws cloudformation describe-stacks --region us-east-1 \
            --stack-name opda-edge \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" --output text)
          echo "OPDA_CERTIFICATE_ARN=$CERT_ARN" >> "$GITHUB_ENV"

      # ---- eu-west-2: artifacts bucket (site Lambda + nested template) ----
      - name: Deploy artifacts stack (eu-west-2)
        run: |
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-artifacts \
            --template-file config/aws/artifacts-stack.yaml \
            --no-fail-on-empty-changeset

      # ---- eu-west-2: comments stack (Artalk runtime; independent of edge/site) ----
      - name: Deploy comments stack (eu-west-2)
        if: hashFiles('config/aws/comments-stack.yaml') != ''
        run: |
          # CloudFront's origin-facing ranges as a managed prefix list — the
          # task security group admits only these (no direct ingress).
          PREFIX_LIST_ID=$(aws ec2 describe-managed-prefix-lists --region eu-west-2 \
            --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing \
            --query 'PrefixLists[0].PrefixListId' --output text)
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-comments \
            --template-file config/aws/comments-stack.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CloudFrontOriginFacingPrefixListId="$PREFIX_LIST_ID" \
              DesiredCount="${{ vars.OPDA_ARTALK_DESIRED_COUNT || '0' }}"

      # ---- eu-west-2: site stack (consumes the certificate ARN as a parameter;
      # CloudFormation exports do not cross regions, ADR-0040 §3) ----
      - name: Deploy participant identity stores (eu-west-2)
        run: |
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-participant-identity \
            --template-file config/aws/participant-identity-stack.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy site stack (eu-west-2)
        if: hashFiles('config/aws/site-stack.yaml') != ''
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-artifacts \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" --output text)
          aws cloudformation package --region eu-west-2 \
            --template-file config/aws/site-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file /tmp/site-packaged.yaml
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-site \
            --template-file /tmp/site-packaged.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CertificateArn="$OPDA_CERTIFICATE_ARN" \
              OnboardingCutover="${{ vars.OPDA_ONBOARDING_CUTOVER || '' }}" \
              DomainReviewCutover="${{ vars.OPDA_DOMAIN_REVIEW_CUTOVER || '' }}" \
              OnboardingEnabled="${{ vars.OPDA_ONBOARDING_ENABLED || 'false' }}" \
              OnboardingCanaryEmailHash="${{ vars.OPDA_ONBOARDING_CANARY_EMAIL_HASH || '' }}"

      # Reconcile the old edge stack only after CloudFront has deployed the site
      # update without viewer-request Lambda associations. On the first retirement
      # run AWS may need additional time to delete replicated Lambda@Edge versions;
      # a retry is safe because the public-site change is already in the site stack.
      - name: Reconcile certificate-only edge stack (us-east-1)
        if: hashFiles('config/aws/edge-stack.yaml') != ''
        run: |
          HOSTED_ZONE_ID=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-bootstrap \
            --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" --output text)
          aws cloudformation deploy --region us-east-1 \
            --stack-name opda-edge \
            --template-file config/aws/edge-stack.yaml \
            --no-fail-on-empty-changeset \
            --parameter-overrides HostedZoneId="$HOSTED_ZONE_ID"
