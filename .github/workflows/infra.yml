name: Infrastructure (CloudFormation)

# Infra CI/CD per ADR-0040 §3: validates and deploys the CloudFormation stacks
# in dependency order: participant stores → packaged/versioned edge gate → site.
# CloudFront replaces its barrier with a validated gate, never an ungated state.
# Change-set based and
# idempotent (--no-fail-on-empty-changeset), so a run that touches only one
# stack is a no-op for the others.
#
# The bootstrap stack (config/aws/bootstrap-stack.yaml) is deliberately NOT
# deployed here — it creates the very role this workflow assumes (ADR-0040).
#
# Auth: GitHub OIDC → opda-site-deploy role; no static AWS keys (ADR-0040 §1).
# Repository configuration required:
#   vars.OPDA_SITE_DEPLOY_ROLE_ARN — from the bootstrap stack outputs
# Store configuration comes from CloudFormation exports; Auth0 reuses its client.

on:
  push:
    branches: [main]
    paths:
      - 'config/aws/**'
      - '.github/workflows/infra.yml'
      - 'tests/hubspot-approval-*.test.mjs'
      - 'tests/auth-session.test.mjs'
      - 'tests/auth-workspace*.test.mjs'
      - 'tests/auth0-session.test.mjs'
      - 'tests/edge-gate.test.mjs'
      - 'scripts/package-edge-gate.mjs'
      - 'scripts/package-comments-api.mjs'
      - 'tests/comments-*.test.mjs'
      - 'tests/aws-working-group-interest-infrastructure.test.mjs'
      - 'tests/hubspot-sync.test.mjs'
      - 'src/approval-onboarding/**'
      - 'src/agents/working-group-inbox/domain.mjs'
      - 'scripts/package-approval-onboarding.mjs'
      - 'docs/templates/assets/opda-email-logo.png'
      - 'tests/approval-onboarding-*.test.mjs'
  # Manual escape hatch, and the sequencing tool for the rare coupled case
  # (infra change that replaces the site bucket/distribution → run this, then
  # the site deploy) — ADR-0040 §5.
  workflow_dispatch:

# Two infra runs must never interleave change sets (ADR-0040 §3).
concurrency:
  group: infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install pinned packaging dependencies
        run: npm ci

      - name: Test participant approval boundary
        run: node --test tests/hubspot-approval-*.test.mjs tests/auth-session.test.mjs tests/hubspot-sync.test.mjs tests/approval-onboarding-*.test.mjs tests/aws-working-group-interest-infrastructure.test.mjs tests/auth0-session.test.mjs tests/edge-gate.test.mjs tests/comments-*.test.mjs tests/auth-workspace*.test.mjs

      - name: Package bounded onboarding runtime locally
        run: node scripts/package-approval-onboarding.mjs

      - name: Package shared edge authorization
        run: node scripts/package-edge-gate.mjs

      - name: Package shared comments authorization
        run: node scripts/package-comments-api.mjs

      - name: Lint templates
        run: |
          pipx install cfn-lint
          cfn-lint config/aws/*.yaml

      - name: Assume deploy role (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OPDA_SITE_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Validate templates
        run: |
          for t in config/aws/*.yaml; do
            aws cloudformation validate-template --region eu-west-2 \
              --template-body "file://$t" --query Description --output text
          done

      # ---- eu-west-2: artifacts bucket (site Lambda + nested template) ----
      - name: Deploy artifacts stack (eu-west-2)
        run: |
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-artifacts \
            --template-file config/aws/artifacts-stack.yaml \
            --no-fail-on-empty-changeset

      - name: Deploy participant identity stores (eu-west-2)
        run: |
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-participant-identity \
            --template-file config/aws/participant-identity-stack.yaml \
            --no-fail-on-empty-changeset

      # ---- eu-west-2: comments gateway and single-writer Artalk runtime ----
      - name: Deploy comments stack (eu-west-2)
        if: hashFiles('config/aws/comments-stack.yaml') != ''
        run: |
          # The gateway uses a free DynamoDB gateway endpoint, not NAT.
          PREFIX_LIST_ID=$(aws ec2 describe-managed-prefix-lists --region eu-west-2 \
            --filters Name=prefix-list-name,Values=com.amazonaws.eu-west-2.dynamodb \
            --query 'PrefixLists[0].PrefixListId' --output text)
          GATEWAY_KEY=$(aws ssm get-parameter --region eu-west-2 --name /opda/comments/gateway-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$GATEWAY_KEY"
          KEY_VERSION=$(aws ssm get-parameter --region eu-west-2 --name /opda/comments/gateway-key \
            --query Parameter.Version --output text)
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-artifacts --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" --output text)
          aws cloudformation package --region eu-west-2 \
            --template-file config/aws/comments-stack.yaml --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file /tmp/comments-packaged.yaml
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-comments \
            --template-file /tmp/comments-packaged.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              DynamoDbPrefixListId="$PREFIX_LIST_ID" GatewayKey="$GATEWAY_KEY" GatewayKeyVersion="$KEY_VERSION" \
              DesiredCount="${{ vars.OPDA_ARTALK_DESIRED_COUNT || '0' }}"

      # ---- eu-west-2: site stack (consumes the certificate ARN as a parameter;
      # CloudFormation exports do not cross regions, ADR-0040 §3) ----
      - name: Deploy versioned gate and certificate (us-east-1)
        run: |
          aws cloudformation deploy --region us-east-1 \
            --stack-name opda-artifacts --template-file config/aws/artifacts-stack.yaml \
            --no-fail-on-empty-changeset
          EDGE_ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks --region us-east-1 \
            --stack-name opda-artifacts \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" --output text)
          HOSTED_ZONE_ID=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-bootstrap \
            --query "Stacks[0].Outputs[?OutputKey=='HostedZoneId'].OutputValue" --output text)
          aws cloudformation package --region us-east-1 \
            --template-file config/aws/edge-stack.yaml --s3-bucket "$EDGE_ARTIFACTS_BUCKET" \
            --output-template-file /tmp/edge-packaged.yaml
          aws cloudformation deploy --region us-east-1 --stack-name opda-edge \
            --template-file /tmp/edge-packaged.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset --parameter-overrides HostedZoneId="$HOSTED_ZONE_ID"
          CERT_ARN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name opda-edge \
            --query "Stacks[0].Outputs[?OutputKey=='CertificateArn'].OutputValue" --output text)
          GATE_ARN=$(aws cloudformation describe-stacks --region us-east-1 --stack-name opda-edge \
            --query "Stacks[0].Outputs[?OutputKey=='GateFunctionVersionArn'].OutputValue" --output text)
          echo "OPDA_CERTIFICATE_ARN=$CERT_ARN" >> "$GITHUB_ENV"
          echo "OPDA_GATE_FUNCTION_ARN=$GATE_ARN" >> "$GITHUB_ENV"

      - name: Deploy site stack (eu-west-2)
        if: hashFiles('config/aws/site-stack.yaml') != ''
        run: |
          ARTIFACTS_BUCKET=$(aws cloudformation describe-stacks --region eu-west-2 \
            --stack-name opda-artifacts \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactsBucketName'].OutputValue" --output text)
          aws cloudformation package --region eu-west-2 \
            --template-file config/aws/site-stack.yaml \
            --s3-bucket "$ARTIFACTS_BUCKET" \
            --output-template-file /tmp/site-packaged.yaml
          aws cloudformation deploy --region eu-west-2 \
            --stack-name opda-site \
            --template-file /tmp/site-packaged.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              CertificateArn="$OPDA_CERTIFICATE_ARN" \
              GateFunctionVersionArn="$OPDA_GATE_FUNCTION_ARN" \
              OnboardingCutover="${{ vars.OPDA_ONBOARDING_CUTOVER || '' }}" \
              DomainReviewCutover="${{ vars.OPDA_DOMAIN_REVIEW_CUTOVER || '' }}" \
              OnboardingEnabled="${{ vars.OPDA_ONBOARDING_ENABLED || 'false' }}" \
              OnboardingCanaryEmailHash="${{ vars.OPDA_ONBOARDING_CANARY_EMAIL_HASH || '' }}"

      - name: Verify deployed workspace boundary without participant effects
        run: |
          aws lambda get-function-configuration --region eu-west-2 \
            --function-name opda-workspace-entry \
            --query '{State:State,Update:LastUpdateStatus,Handler:Handler,Timeout:Timeout,CodeSha256:CodeSha256}'
          aws lambda invoke --region eu-west-2 --function-name opda-workspace-entry \
            --cli-binary-format raw-in-base64-out \
            --payload '{"schemaVersion":1,"sessionToken":"","groupId":"finance-and-banking","phase":"open"}' \
            /tmp/opda-workspace-denied.json
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import assert from 'node:assert/strict'; assert.deepEqual(JSON.parse(readFileSync('/tmp/opda-workspace-denied.json','utf8')), {status:'denied'}); console.log('Deployed workspace boundary rejects an invalid session; no participant effects.');"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin = 'https://opda.org.uk';
          const cases = [
            ['missing origin', '/_auth/workspace', 'POST', {}, 403],
            ['foreign origin', '/_auth/workspace', 'POST', {origin:'https://example.invalid','sec-fetch-site':'cross-site'}, 403],
            ['missing session', '/_auth/workspace', 'POST', {origin,'sec-fetch-site':'same-origin'}, 403],
            ['resources landing stays gated', '/resources/?list-type=2', 'GET', {}, 302],
          ];
          await Promise.all(cases.map(async ([name,path,method,headers,status]) => {
            const response = await fetch(origin+path, {method,redirect:'manual',signal:AbortSignal.timeout(10000),
              headers:{'content-type':'application/x-www-form-urlencoded',...headers},
              ...(method==='POST' ? {body:'group=finance-and-banking&phase=open'} : {})});
            assert.equal(response.status,status,name);
            if(method==='POST') assert.equal(typeof (await response.json()).error,'string',name);
            else {
              assert.match(response.headers.get('location') || '', /^\/_auth\/login\?return=/);
              assert.equal(await response.text(), '', 'No bucket listing or protected content is returned');
            }
            console.log('Live workspace check passed: '+name);
          }));
          NODE
