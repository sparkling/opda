# Artifacts stack — opda.org.uk AWS hosting (ADR-0040)
#
# A private, regional S3 bucket used by `aws cloudformation package` to stage
# Lambda deployment zips and nested templates. CI deploys one copy in
# us-east-1 for Lambda@Edge and one in eu-west-2 for the site API.
#
# Deployed by CI before the stack it packages. It is an implementation detail:
# CloudFormation still owns every deployed runtime resource.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  opda.org.uk regional CloudFormation packaging artifacts bucket (ADR-0040).

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          # Packaged zips are content-addressed and re-uploaded per deploy;
          # old ones serve no purpose after the stack references move on.
          - Id: expire-stale-artifacts
            Status: Enabled
            ExpirationInDays: 30

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
    Export:
      Name: opda-artifacts-bucket
