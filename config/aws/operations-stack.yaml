AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Account-level operational alerting for eu-west-2 (ADR-0087). Every service stack
  declared an AlarmTopicArn that nothing supplied, so every alarm was inert. This
  is the destination they import.

Parameters:
  AlarmEmail:
    Type: String
    Default: ''
    Description: >-
      Optional address for operational alarms. The recipient must confirm the SNS
      subscription by email before any alarm can reach them; until then the topic
      exists and the alarms are wired, but nobody is notified.

  AlarmTeamsChannelEmail:
    Type: String
    Default: ''
    Description: >-
      Optional email address of a Microsoft Teams channel (Teams: channel ... >
      Get email address). Every alarm then posts into that channel, where Teams
      mobile pushes it. The channel must confirm the SNS subscription once: the
      confirmation arrives as the first post.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  HasAlarmTeamsChannelEmail: !Not [!Equals [!Ref AlarmTeamsChannelEmail, '']]

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: opda-operations-alarms
      DisplayName: OPDA operations

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  # A mailbox is not read at 03:00; a Teams channel pushes to phones and gives the
  # alarm a place to be discussed. Same payload, so it stays free of personal data.
  AlarmTeamsChannelSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmTeamsChannelEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmTeamsChannelEmail

Outputs:
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export: { Name: !Sub '${AWS::StackName}-AlarmTopicArn' }
