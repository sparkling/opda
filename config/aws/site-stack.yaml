# Regional site and participant services (ADR-0038/0040/0079/0084).
# CI passes the us-east-1 certificate ARN and packages local nested templates.
# Artalk runtime is independent; only its CloudFront origin/behavior live here.
# A fail-closed development barrier protects every CloudFront behavior.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  opda.org.uk site resources (eu-west-2): S3 + CloudFront, Route 53 records,
  development-restricted site, path-scoped auth session, submission APIs and their shared
  post-persistence event boundary
  (ADR-0038/ADR-0040/ADR-0069/ADR-0079).

Parameters:
  DomainName:
    Type: String
    Default: opda.org.uk
  CertificateArn:
    Type: String
    Description: ACM certificate ARN (us-east-1, from the opda-edge stack).
  IdentityStackName:
    Type: String
    Default: opda-participant-identity
    Description: Approved participant identity stack, deployed first in this region.
  HubSpotBridgeSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:eu-west-2:355653384628:secret:opda/hubspot/participant-crm-bridge-IOhsJX
    Description: ARN only, never the token; runtime reads the existing private app credential.
  OnboardingCutover: { Type: String, Default: '' }
  DomainReviewCutover: { Type: String, Default: '' }
  OnboardingEnabled: { Type: String, Default: 'false', AllowedValues: ['false', 'true'] }
  OnboardingCanaryEmailHash: { Type: String, Default: '', AllowedPattern: '^$|^[a-f0-9]{64}$' }

Resources:
  AuthSessionApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]
    Properties:
      TemplateURL: auth-session-stack.yaml
      Parameters:
        DomainName: !Ref DomainName
        IdentityStackName: !Ref IdentityStackName

  WorkingGroupInterestApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]
    Properties:
      TemplateURL: working-group-interest-stack.yaml

  NewsletterSubscriptionApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]
    Properties:
      TemplateURL: newsletter-subscription-stack.yaml

  SubmissionEventsApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002]
    Properties:
      TemplateURL: submission-events-stack.yaml
      Parameters:
        RegistrationsTableStreamArn: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableStreamArn
        SubscriptionsTableStreamArn: !GetAtt NewsletterSubscriptionApplication.Outputs.SubscriptionsTableStreamArn

  HubSpotSignupSyncApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config: { ignore_checks: [W3002] }
    Properties:
      TemplateURL: hubspot-sync-stack.yaml
      Parameters:
        SourceTopicArn: !GetAtt SubmissionEventsApplication.Outputs.SubmissionEventsTopicArn
        RegistrationsTableName: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableName
        RegistrationsTableArn: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableArn
        ParticipantsTableName:
          Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableName'
        ParticipantsTableArn:
          Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn'
        BridgeSecretArn: !Ref HubSpotBridgeSecretArn

  HubSpotApprovalApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config: { ignore_checks: [W3002] }
    Properties:
      TemplateURL: hubspot-approval-stack.yaml
      Parameters:
        OnboardingCutover: !Ref OnboardingCutover
        DomainReviewCutover: !Ref DomainReviewCutover
        OnboardingEnabled: !Ref OnboardingEnabled
        OnboardingCanaryEmailHash: !Ref OnboardingCanaryEmailHash
        RegistrationsTableName: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableName
        RegistrationsTableArn: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableArn
        ParticipantsTableName:
          Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableName'
        ParticipantsTableArn:
          Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn'
        UserPoolId:
          Fn::ImportValue: !Sub '${IdentityStackName}-UserPoolId'
        UserPoolArn:
          Fn::ImportValue: !Sub '${IdentityStackName}-UserPoolArn'
        BridgeSecretArn: !Ref HubSpotBridgeSecretArn

  # ---------------- Static site: S3 + CloudFront ----------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Public resources bucket — fronted by the SAME distribution under
  # /resources/*. Kept SEPARATE
  # from SiteBucket on purpose: the deploy syncs dist/ → SiteBucket with
  # --delete, which would wipe any shared prefix. Still private to direct S3
  # access (PublicAccessBlock all-true); CloudFront reads it via OAC.
  ResourcesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ResourcesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResourcesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${ResourcesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Artalk authenticates via the Authorization header and uses no cookies —
  # and MUST NOT receive the viewer's cookie jar: legacy cookies can push the
  # Cookie header past fasthttp's 4 KB request-header cap, and Artalk answers
  # 431 before routing (root-caused 2026-06-06: the
  # browser SSO exchange failed while a minimal-cookie curl succeeded). The
  # origin therefore gets everything except cookies.
  CommentsOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: opda-comments-no-cookies
        Comment: All viewer headers except Host, all query strings, NO cookies
        HeadersConfig: { HeaderBehavior: allViewer }
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }

  PublicFormOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: opda-public-form-minimal
        Comment: Forward only submission content type; no viewer cookies or query strings
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Content-Type]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: none }

  # The explicit login flow needs its short-lived transaction/session cookies
  # and OAuth query parameters. It receives no viewer headers (especially not
  # Host), and its cache behavior below is disabled.
  AuthSessionOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: opda-auth-session-cookies-and-query
        Comment: Forward OAuth cookies and query strings only to /_auth/*
        HeadersConfig: { HeaderBehavior: none }
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: opda-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResourcesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: opda-resources-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Emergency privacy barrier, 2026-09-09. Deliberately denies all viewers,
  # including existing sessions, until approved-user federation is restored.
  # Runs before cache lookup on EVERY behavior, not only HTML navigation.
  # No cookie-presence bypass, asset exception, external dependency or origin fetch.
  DevelopmentBarrierFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: opda-under-development
      AutoPublish: true
      FunctionConfig:
        Comment: Fail-closed under-development barrier for every site request
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          return {
            statusCode: 503,
            statusDescription: 'Service Unavailable',
            headers: {
              'content-type': { value: 'text/html; charset=utf-8' },
              'cache-control': { value: 'no-store, max-age=0' },
              'retry-after': { value: '3600' },
              'x-robots-tag': { value: 'noindex, nofollow, noarchive' },
              'x-content-type-options': { value: 'nosniff' },
              'content-security-policy': { value: "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" }
            },
            body: '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>OPDA | Under development</title><style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;align-items:center;background:#131225;color:#fff;font-family:Arial,sans-serif;padding:clamp(24px,6vw,80px)}main{width:100%;max-width:1024px;margin-inline:auto;border-top:6px solid #ffcc2a;padding-block:40px}.brand{font-size:clamp(18px,3vw,26px);margin:0 0 64px}.brand span{color:#77b4ed}.status{color:#ffcc2a;text-transform:uppercase;font-size:14px;font-weight:700;letter-spacing:.12em}h1{font-family:Georgia,serif;font-size:clamp(44px,8vw,88px);line-height:1.05;margin:16px 0 28px}p{font-size:clamp(18px,2.5vw,24px);line-height:1.6;max-width:720px;margin:0}@media(prefers-color-scheme:light){body{background:#fff;color:#131225}.brand span{color:#185a91}.status{color:#554600}}</style></head><body><main><p class="brand">Open Property Data <span>Association</span></p><p class="status">OPDA knowledge base</p><h1>Under development</h1><p>Our website is being developed. Access is temporarily restricted while we prepare the site for approved participants.</p></main></body></html>'
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: opda.org.uk (ADR-0038)
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        PriceClass: PriceClass_100   # NA + Europe — includes the London PoPs
        DefaultRootObject: index.html
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Public resources origin (served under /resources/* below).
          - Id: resources-s3
            DomainName: !GetAtt ResourcesBucket.RegionalDomainName
            OriginAccessControlId: !Ref ResourcesOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Artalk comments origin — the comments stack maintains this DNS
          # name (single Fargate task's public IP). Resolution happens at
          # request time, so the origin may predate the record; /api/v2/*
          # 502s until the comments stack is live, which is harmless.
          - Id: comments
            DomainName: !Sub 'comments-origin.${DomainName}'
            CustomOriginConfig:
              HTTPPort: 23366
              OriginProtocolPolicy: http-only
          - Id: working-group-interest-api
            DomainName: !GetAtt WorkingGroupInterestApplication.Outputs.ApiOriginDomainName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: newsletter-subscription-api
            DomainName: !GetAtt NewsletterSubscriptionApplication.Outputs.ApiOriginDomainName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: auth-session-api
            DomainName: !GetAtt AuthSessionApplication.Outputs.ApiOriginDomainName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
        CacheBehaviors:
          # Explicit member sign-in only. This does not gate or inspect any
          # public content path and cannot match the default site behavior.
          - PathPattern: '/_auth/*'
            TargetOriginId: auth-session-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref AuthSessionOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
          # Public static assets. Long-TTL via the
          # same managed CachingOptimized policy the default behavior uses.
          # Ordered ahead of the default behavior.
          - PathPattern: '/resources/*'
            TargetOriginId: resources-s3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
            # Resources are protected too; an HTML-only barrier would leak files.
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
          - PathPattern: '/api/v2/*'
            TargetOriginId: comments
            ViewerProtocolPolicy: redirect-to-https
            # Read-only during the Cognito migration: old Artalk JWTs cannot write.
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref CommentsOriginRequestPolicy  # no cookies to Artalk
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
          # Public same-origin API. HTTP API exposes only the registration POST route;
          # CloudFront's POST-capable method set necessarily includes the
          # remaining verbs, which API Gateway rejects because no routes exist.
          - PathPattern: '/api/working-group-interest*'
            TargetOriginId: working-group-interest-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref PublicFormOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
          - PathPattern: '/api/newsletter-subscription*'
            TargetOriginId: newsletter-subscription-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref PublicFormOriginRequestPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt DevelopmentBarrierFunction.FunctionARN
        CustomErrorResponses:
          # OAC without ListBucket → S3 answers missing keys with 403.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # ---------------- DNS ----------------

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !ImportValue opda-hosted-zone-id
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed zone ID
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  HubSpotApprovalApiEndpoint:
    Value: !GetAtt HubSpotApprovalApplication.Outputs.ApiEndpoint
  HubSpotApprovalWebhookUrl:
    Value: !GetAtt HubSpotApprovalApplication.Outputs.WebhookUrl
  HubSpotApprovalWorkerName:
    Value: !GetAtt HubSpotApprovalApplication.Outputs.WorkerFunctionName
  HubSpotApprovalQueueUrl:
    Value: !GetAtt HubSpotApprovalApplication.Outputs.ApprovalQueueUrl
  HubSpotApprovalFailureQueueUrl:
    Value: !GetAtt HubSpotApprovalApplication.Outputs.FailureQueueUrl
  HubSpotSignupWorkerName:
    Value: !GetAtt HubSpotSignupSyncApplication.Outputs.WorkerFunctionName
  HubSpotSignupQueueUrl:
    Value: !GetAtt HubSpotSignupSyncApplication.Outputs.SignupQueueUrl
  HubSpotSignupFailureQueueUrl:
    Value: !GetAtt HubSpotSignupSyncApplication.Outputs.FailureQueueUrl
  SiteBucketName:
    Value: !Ref SiteBucket
  ResourcesBucketName:
    Description: Public resources bucket — publish step syncs assets here (served at /resources/*).
    Value: !Ref ResourcesBucket
  ResourcesBucketDomainName:
    Description: Regional domain name of the public resources bucket.
    Value: !GetAtt ResourcesBucket.RegionalDomainName
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  WorkingGroupInterestApiEndpoint:
    Description: Direct HTTP API endpoint for diagnostics; browsers use the same-origin CloudFront path.
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.ApiEndpoint
  AuthSessionApiEndpoint:
    Description: Direct HTTP API endpoint for diagnostics; browsers use /_auth/* through CloudFront.
    Value: !GetAtt AuthSessionApplication.Outputs.ApiEndpoint
  AuthSessionCallbackUrl:
    Description: Registered callback for the Cognito website client.
    Value: !Sub 'https://${DomainName}/_auth/callback'
  WorkingGroupInterestFunctionName:
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.FunctionName
  WorkingGroupInterestRegistrationsTableName:
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableName
  NewsletterSubscriptionApiEndpoint:
    Description: Direct HTTP API endpoint for diagnostics; browsers use the same-origin CloudFront path.
    Value: !GetAtt NewsletterSubscriptionApplication.Outputs.ApiEndpoint
  NewsletterSubscriptionFunctionName:
    Value: !GetAtt NewsletterSubscriptionApplication.Outputs.FunctionName
  NewsletterSubscriptionsTableName:
    Value: !GetAtt NewsletterSubscriptionApplication.Outputs.SubscriptionsTableName
  SubmissionEventsTopicArn:
    Value: !GetAtt SubmissionEventsApplication.Outputs.SubmissionEventsTopicArn
  SubmissionEventsQueueUrl:
    Description: Durable reference-only handoff for future submission-event consumers.
    Value: !GetAtt SubmissionEventsApplication.Outputs.SubmissionEventsQueueUrl
  SubmissionEventsFailureQueueUrl:
    Description: Exhausted stream batches and failed SNS-to-SQS deliveries.
    Value: !GetAtt SubmissionEventsApplication.Outputs.SubmissionEventsFailureQueueUrl
