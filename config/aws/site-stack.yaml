# Site stack — opda.org.uk AWS hosting (ADR-0038 / ADR-0040 / ADR-0079)
#
# The eu-west-2 stack: everything except the us-east-1 ACM certificate, which
# arrives as a parameter from the edge stack (exports do not cross regions).
#
#   - Private S3 site bucket + public CloudFront distribution (OAC)
#   - /api/v2/* routed to the Artalk comments origin
#   - Route 53 apex alias records
#
# The Artalk runtime (VPC, ECS Fargate, ECR, Litestream bucket, the
# comments-origin DNS updater) lives in the comments stack; this stack only
# carries the CloudFront origin + behavior pointing at it.
#
# Deployed by CI (.github/workflows/infra.yml). During the ADR-0079 transition,
# CI removes CloudFront's gate association before reconciling the certificate-only
# edge stack, so Lambda@Edge replicas are no longer attached when deleted.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  opda.org.uk site resources (eu-west-2): S3 + CloudFront, Route 53 records,
  public site and working-group interest API (ADR-0038/ADR-0040/ADR-0069/ADR-0079).

Parameters:
  DomainName:
    Type: String
    Default: opda.org.uk
  CertificateArn:
    Type: String
    Description: ACM certificate ARN (us-east-1, from the opda-edge stack).

Resources:
  WorkingGroupInterestApplication:
    Type: AWS::CloudFormation::Stack
    Metadata:
      cfn-lint:
        config:
          # A local nested-template URL is intentional: the infra workflow
          # runs `aws cloudformation package` before deployment.
          ignore_checks: [W3002]
    Properties:
      TemplateURL: working-group-interest-stack.yaml

  # ---------------- Static site: S3 + CloudFront ----------------

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Public resources bucket — fronted by the SAME distribution under
  # /resources/*. Kept SEPARATE
  # from SiteBucket on purpose: the deploy syncs dist/ → SiteBucket with
  # --delete, which would wipe any shared prefix. Still private to direct S3
  # access (PublicAccessBlock all-true); CloudFront reads it via OAC.
  ResourcesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ResourcesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResourcesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontOacRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${ResourcesBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  # Artalk authenticates via the Authorization header and uses no cookies —
  # and MUST NOT receive the viewer's cookie jar: legacy cookies can push the
  # Cookie header past fasthttp's 4 KB request-header cap, and Artalk answers
  # 431 before routing (root-caused 2026-06-06: the
  # browser SSO exchange failed while a minimal-cookie curl succeeded). The
  # origin therefore gets everything except cookies.
  CommentsOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: opda-comments-no-cookies
        Comment: All viewer headers except Host, all query strings, NO cookies
        HeadersConfig: { HeaderBehavior: allViewer }
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }

  WorkingGroupInterestOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: opda-working-group-interest-minimal
        Comment: Forward only JSON content type; no viewer cookies or query strings
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Content-Type]
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: none }

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: opda-site-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ResourcesOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: opda-resources-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Rewrites /resources/<path> → /<path> before the resources-s3 origin fetch.
  # The bucket mirrors source/ at its root, so the object key carries no
  # `resources/` prefix; CloudFront otherwise forwards the full URI and every
  # /resources/* request 404s. A CloudFront Function (viewer-request) is the
  # cheapest, lowest-latency way to do this — no Lambda@Edge needed.
  ResourcesPrefixStripFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: opda-resources-prefix-strip
      AutoPublish: true
      FunctionConfig:
        Comment: Strip the /resources prefix for the resources-s3 origin
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          request.uri = request.uri.replace(/^\/resources/, '');
          if (request.uri === '') { request.uri = '/'; }
          return request;
        }

  # Astro's directory build emits /path/index.html while the public IA uses
  # bare slugs such as /programme and /join. S3 origins do not apply
  # DefaultRootObject below nested paths, so resolve clean document requests
  # before the origin lookup while leaving explicit asset filenames unchanged.
  CleanUrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: opda-clean-url-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve bare and trailing-slash document URLs to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var leaf = uri.substring(uri.lastIndexOf('/') + 1);
          if (uri.charAt(uri.length - 1) === '/') {
            request.uri = uri + 'index.html';
          } else if (leaf.indexOf('.') === -1) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: opda.org.uk (ADR-0038)
        Aliases: [!Ref DomainName]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        HttpVersion: http2and3
        PriceClass: PriceClass_100   # NA + Europe — includes the London PoPs
        DefaultRootObject: index.html
        Origins:
          - Id: site-s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Public resources origin (served under /resources/* below).
          - Id: resources-s3
            DomainName: !GetAtt ResourcesBucket.RegionalDomainName
            OriginAccessControlId: !Ref ResourcesOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          # Artalk comments origin — the comments stack maintains this DNS
          # name (single Fargate task's public IP). Resolution happens at
          # request time, so the origin may predate the record; /api/v2/*
          # 502s until the comments stack is live, which is harmless.
          - Id: comments
            DomainName: !Sub 'comments-origin.${DomainName}'
            CustomOriginConfig:
              HTTPPort: 23366
              OriginProtocolPolicy: http-only
          - Id: working-group-interest-api
            DomainName: !GetAtt WorkingGroupInterestApplication.Outputs.ApiOriginDomainName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: site-s3
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CleanUrlRewriteFunction.FunctionARN
        CacheBehaviors:
          # Public static assets. Long-TTL via the
          # same managed CachingOptimized policy the default behavior uses.
          # Ordered ahead of the default behavior.
          - PathPattern: '/resources/*'
            TargetOriginId: resources-s3
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
            # Strip the /resources prefix so the request maps to the bucket key
            # (the bucket mirrors source/ at its root, e.g. 08-foo/bar.pdf —
            # NOT resources/08-foo/bar.pdf). Without this every /resources/* 404s.
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ResourcesPrefixStripFunction.FunctionARN
          - PathPattern: '/api/v2/*'
            TargetOriginId: comments
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref CommentsOriginRequestPolicy  # no cookies to Artalk
          # Public same-origin API. HTTP API exposes only the registration POST route;
          # CloudFront's POST-capable method set necessarily includes the
          # remaining verbs, which API Gateway rejects because no routes exist.
          - PathPattern: '/api/working-group-interest*'
            TargetOriginId: working-group-interest-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad     # Managed-CachingDisabled
            OriginRequestPolicyId: !Ref WorkingGroupInterestOriginRequestPolicy
        CustomErrorResponses:
          # OAC without ListBucket → S3 answers missing keys with 403.
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  # ---------------- DNS ----------------

  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: !ImportValue opda-hosted-zone-id
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's fixed zone ID
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt Distribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  SiteBucketName:
    Value: !Ref SiteBucket
  ResourcesBucketName:
    Description: Public resources bucket — publish step syncs assets here (served at /resources/*).
    Value: !Ref ResourcesBucket
  ResourcesBucketDomainName:
    Description: Regional domain name of the public resources bucket.
    Value: !GetAtt ResourcesBucket.RegionalDomainName
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  WorkingGroupInterestApiEndpoint:
    Description: Direct HTTP API endpoint for diagnostics; browsers use the same-origin CloudFront path.
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.ApiEndpoint
  WorkingGroupInterestFunctionName:
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.FunctionName
  WorkingGroupInterestRegistrationsTableName:
    Value: !GetAtt WorkingGroupInterestApplication.Outputs.RegistrationsTableName
