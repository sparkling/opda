AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Auth0 social OAuth and approval-bound opaque participant sessions.
  CloudFront protects site content separately (ADR-0038/ADR-0084).

Parameters:
  DomainName:
    Type: String
    Default: opda.org.uk
  IdentityStackName:
    Type: String
    Default: opda-participant-identity
    Description: Regional stack exporting the approved-participant identity stores.
  Auth0Domain: { Type: String, Default: sparklesparkle.auth0.com }
  Auth0ClientId: { Type: String, Default: xjPgyXLJllYtefV6LZkZ6oYnce89RlZT }

Resources:
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/opda-auth-session
      RetentionInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opda-auth-session
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: auth-session-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opda-auth-session:*'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:ConditionCheckItem]
                Resource:
                  Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn'
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
                Resource:
                  Fn::ImportValue: !Sub '${IdentityStackName}-SessionsTableArn'
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn'
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['IDENTITY#*']
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:opda-workspace-entry'

  Function:
    Type: AWS::Serverless::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: opda-auth-session
      CodeUri: auth-session/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          OIDC_PROVIDER: auth0
          AUTH0_DOMAIN: !Ref Auth0Domain
          AUTH0_CLIENT_ID: !Ref Auth0ClientId
          PARTICIPANTS_TABLE_NAME:
            Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableName'
          SESSIONS_TABLE_NAME:
            Fn::ImportValue: !Sub '${IdentityStackName}-SessionsTableName'
          SITE_ORIGIN: !Sub 'https://${DomainName}'

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: opda-auth-session
      Description: Same-origin OAuth session endpoints for explicit OPDA member sign-in
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  LoginRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/login
      Target: !Sub 'integrations/${Integration}'

  CallbackRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/callback
      Target: !Sub 'integrations/${Integration}'

  MeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/me
      Target: !Sub 'integrations/${Integration}'

  LogoutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/logout
      Target: !Sub 'integrations/${Integration}'

  WorkspaceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/workspace
      Target: !Sub 'integrations/${Integration}'

  WorkspacePostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /_auth/workspace
      Target: !Sub 'integrations/${Integration}'

  WorkspaceContinueRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /_auth/workspace/continue
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: false
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/_auth/*'

  WorkspaceInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/_auth/workspace'

  WorkspaceContinueInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/_auth/workspace/continue'

Outputs:
  ApiEndpoint:
    Value: !GetAtt Api.ApiEndpoint
  ApiOriginDomainName:
    Value: !Sub '${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionName:
    Value: !Ref Function
