AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Daily native PITR and scoped CRM profile recovery to private versioned S3 (ADR-0084).

Parameters:
  ParticipantsTableArn:
    Type: String
    AllowedPattern: 'arn:aws:dynamodb:[a-z0-9-]+:[0-9]{12}:table/[A-Za-z0-9_.-]+'
  RegistrationsTableArn:
    Type: String
    AllowedPattern: 'arn:aws:dynamodb:[a-z0-9-]+:[0-9]{12}:table/[A-Za-z0-9_.-]+'
  RecoveryBucketName:
    Type: String
    AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
  HubSpotBridgeSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:opda/hubspot/participant-crm-bridge-[A-Za-z0-9]+'
  HubSpotPortalId:
    Type: Number
    Default: 144765514
    MinValue: 1
  AlarmTopicArn:
    Type: String
    Default: ''
    AllowedPattern: '(^$|arn:aws:sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+)'

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/opda-participant-backup
      RetentionInDays: 14

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: participant-recovery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opda-participant-backup:*'
              - Effect: Allow
                Action: [dynamodb:ExportTableToPointInTime, dynamodb:DescribeContinuousBackups]
                Resource: [!Ref ParticipantsTableArn, !Ref RegistrationsTableArn]
              - Effect: Allow
                Action: dynamodb:DescribeExport
                Resource: [!Sub '${ParticipantsTableArn}/export/*', !Sub '${RegistrationsTableArn}/export/*']
              - Effect: Allow
                Action: [s3:PutObject, s3:PutObjectAcl, s3:AbortMultipartUpload, s3:GetObject]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecoveryBucketName}/recovery/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${RecoveryBucketName}'
                Condition: { StringLike: { 's3:prefix': 'recovery/*' } }
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref HubSpotBridgeSecretArn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition: { StringEquals: { 'cloudwatch:namespace': OPDA/ParticipantRecovery } }

  Function:
    Type: AWS::Serverless::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: opda-participant-backup
      CodeUri: participant-backup/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          ACCOUNT_ID: !Ref AWS::AccountId
          PARTICIPANTS_TABLE_ARN: !Ref ParticipantsTableArn
          REGISTRATIONS_TABLE_ARN: !Ref RegistrationsTableArn
          RECOVERY_BUCKET_NAME: !Ref RecoveryBucketName
          HUBSPOT_BRIDGE_SECRET_ARN: !Ref HubSpotBridgeSecretArn
          HUBSPOT_PORTAL_ID: !Ref HubSpotPortalId

  DailyStart:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'cron(0 2 * * ? *)'
      State: ENABLED
      Targets:
        - Id: StartRecovery
          Arn: !GetAtt Function.Arn
          Input: '{"mode":"start"}'
          RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }

  DailyStartPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyStart.Arn

  HourlyVerification:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: 'cron(15 * * * ? *)'
      State: ENABLED
      Targets:
        - Id: VerifyRecovery
          Arn: !GetAtt Function.Arn
          Input: '{"mode":"verify"}'
          RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 1800 }

  HourlyVerificationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: events.amazonaws.com
      SourceArn: !GetAtt HourlyVerification.Arn

  FailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recovery invocation failed; partial exports are not a completed recovery point.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  StaleRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No verified complete participant and scoped CRM recovery point for approximately 26 hours.
      Namespace: OPDA/ParticipantRecovery
      MetricName: CompletedRecovery
      Dimensions: [{ Name: FunctionName, Value: !Ref Function }]
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 26
      DatapointsToAlarm: 26
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  FunctionName:
    Value: !Ref Function
  FailureAlarmName:
    Value: !Ref FailureAlarm
  StaleRecoveryAlarmName:
    Value: !Ref StaleRecoveryAlarm
