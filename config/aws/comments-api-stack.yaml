AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Approval-bound comments gateway to private Artalk, without NAT or a load balancer.

Parameters:
  VpcId: { Type: AWS::EC2::VPC::Id }
  SubnetIds: { Type: List<AWS::EC2::Subnet::Id> }
  RouteTableId: { Type: String }
  TaskSecurityGroupId: { Type: AWS::EC2::SecurityGroup::Id }
  DynamoDbPrefixListId: { Type: String }
  OriginHostname: { Type: String }
  GatewayKey: { Type: String, NoEcho: true, AllowedPattern: '^[a-f0-9]{64}$' }
  IdentityStackName: { Type: String, Default: opda-participant-identity }

Resources:
  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OPDA comments gateway, private Artalk and DynamoDB only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 23366, ToPort: 23366, DestinationSecurityGroupId: !Ref TaskSecurityGroupId }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref DynamoDbPrefixListId }

  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Gateway
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      RouteTableIds: [!Ref RouteTableId]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: dynamodb:GetItem
            Resource:
              - { Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn' }
              - { Fn::ImportValue: !Sub '${IdentityStackName}-SessionsTableArn' }

  Logs:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /aws/lambda/opda-comments-api, RetentionInDays: 14 }

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opda-comments-api
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: current-approval-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  - { Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableArn' }
                  - { Fn::ImportValue: !Sub '${IdentityStackName}-SessionsTableArn' }

  Function:
    Type: AWS::Serverless::Function
    DependsOn: [Logs, DynamoDbEndpoint]
    Properties:
      FunctionName: opda-comments-api
      CodeUri: ../../_build/comments/
      Handler: comments-api/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Role: !GetAtt FunctionRole.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref GatewaySecurityGroup]
      Environment:
        Variables:
          PARTICIPANTS_TABLE_NAME: { Fn::ImportValue: !Sub '${IdentityStackName}-ParticipantsTableName' }
          SESSIONS_TABLE_NAME: { Fn::ImportValue: !Sub '${IdentityStackName}-SessionsTableName' }
          ARTALK_ORIGIN: !Sub 'http://${OriginHostname}:23366'
          OPDA_COMMENTS_GATEWAY_KEY: !Ref GatewayKey

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties: { Name: opda-comments-api, ProtocolType: HTTP }
  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000
  ReadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref Api, RouteKey: 'GET /api/v2/comments', Target: !Sub 'integrations/${Integration}' }
  CreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: { ApiId: !Ref Api, RouteKey: 'POST /api/v2/comments', Target: !Sub 'integrations/${Integration}' }
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings: { DetailedMetricsEnabled: false, ThrottlingBurstLimit: 10, ThrottlingRateLimit: 5 }
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*/api/v2/comments'

Outputs:
  GatewaySecurityGroupId: { Value: !Ref GatewaySecurityGroup }
  ApiOriginDomainName: { Value: !Sub '${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}' }
