AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Applicant acknowledgement for working-group submissions (ADR-0087). Its own
  queue, function, credential and failure domain: it cannot reach the CRM, so no
  CRM match, throttle or outage can delay or withhold a receipt.

Parameters:
  SourceTopicArn:
    Type: String
  RegistrationsTableArn:
    Type: String
  RegistrationsTableName:
    Type: String
  ParticipantsTableArn:
    Type: String
  ParticipantsTableName:
    Type: String
  TransferNoticeVersion:
    Type: String
    Default: '2026-09-08'
    Description: Exact reviewed transfer notice; a historic version is never silently migrated.
  AlarmTopicArn:
    Type: String
    Default: ''

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: opda-application-acknowledgement-failures
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AcknowledgementQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: opda-application-acknowledgements
      MessageRetentionPeriod: 1209600
      VisibilityTimeout: 360
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FailureQueue.Arn
        maxReceiveCount: 8

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref AcknowledgementQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DedicatedTopicDelivery
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt AcknowledgementQueue.Arn
            Condition:
              ArnEquals: { 'aws:SourceArn': !Ref SourceTopicArn }
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
          - Sid: RequireTransportEncryption
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt AcknowledgementQueue.Arn
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  FailureQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref FailureQueue]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DedicatedTopicRedrive
            Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt FailureQueue.Arn
            Condition:
              ArnEquals: { 'aws:SourceArn': !Ref SourceTopicArn }
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
          - Sid: RequireTransportEncryption
            Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: !GetAtt FailureQueue.Arn
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  AcknowledgementSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: [QueuePolicy, FailureQueuePolicy]
    Properties:
      TopicArn: !Ref SourceTopicArn
      Protocol: sqs
      Endpoint: !GetAtt AcknowledgementQueue.Arn
      RawMessageDelivery: true
      FilterPolicyScope: MessageAttributes
      FilterPolicy:
        eventType: ['working-group-interest.received.v1']
        recordKind: ['working-group-interest']
        schemaVersion: ['1']
      RedrivePolicy: { deadLetterTargetArn: !GetAtt FailureQueue.Arn }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/opda-application-acknowledgement
      RetentionInDays: 14

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: applicant-acknowledgement-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opda-application-acknowledgement:*'
              - Sid: ConsumeDedicatedQueueOnly
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes, sqs:ChangeMessageVisibility]
                Resource: !GetAtt AcknowledgementQueue.Arn
              - Sid: OriginalIntakeReadOnly
                Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Ref RegistrationsTableArn
              # Send records only. Suppression records are read through the same
              # condition; this role can write nothing outside its own send log.
              - Sid: AcknowledgementSendLogOnly
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !Ref ParticipantsTableArn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['SYNC#ACK#*']
                  'Null': { 'dynamodb:LeadingKeys': 'false' }
              - Sid: SuppressionReadOnly
                Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !Ref ParticipantsTableArn
                Condition:
                  ForAllValues:StringLike:
                    dynamodb:LeadingKeys: ['SYNC#SUPPRESS#*']
                  'Null': { 'dynamodb:LeadingKeys': 'false' }
              # The shared transactional Postmark server, read-only. Template
              # authoring stays operator-side; this role can only send the pinned one.
              - Sid: AcknowledgementMailCredential
                Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:opda/postmark/participation-onboarding-??????'

  Worker:
    Type: AWS::Serverless::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: opda-application-acknowledgement
      # Package the shared template and property contracts without duplicating them.
      CodeUri: ./
      Handler: acknowledgement/index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 60
      ReservedConcurrentExecutions: 2
      Role: !GetAtt WorkerRole.Arn
      Environment:
        Variables:
          REGISTRATIONS_TABLE_NAME: !Ref RegistrationsTableName
          PARTICIPANTS_TABLE_NAME: !Ref ParticipantsTableName
          POSTMARK_SECRET_ARN: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:opda/postmark/participation-onboarding-U02V9v'
          TRANSFER_NOTICE_VERSION: !Ref TransferNoticeVersion
          ACKNOWLEDGEMENT_QUEUE_ARN: !GetAtt AcknowledgementQueue.Arn
          ACKNOWLEDGEMENT_QUEUE_URL: !Ref AcknowledgementQueue

  AcknowledgementMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AcknowledgementQueue.Arn
      FunctionName: !Ref Worker
      BatchSize: 1
      FunctionResponseTypes: [ReportBatchItemFailures]
      ScalingConfig: { MaximumConcurrency: 2 }

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An applicant acknowledgement could not be sent and needs operator replay.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{ Name: QueueName, Value: !GetAtt FailureQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  PendingAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: An applicant has been waiting over 15 minutes for an acknowledgement.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions: [{ Name: QueueName, Value: !GetAtt AcknowledgementQueue.QueueName }]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The acknowledgement worker is failing; applicants may not be hearing back.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref Worker }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  WorkerFunctionName:
    Value: !Ref Worker
  AcknowledgementQueueArn:
    Value: !GetAtt AcknowledgementQueue.Arn
