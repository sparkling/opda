AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Public working-group expression-of-interest API: HTTP API, Lambda and the
  encrypted authoritative DynamoDB register (ADR-0069).

Resources:
  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S
      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
        RecoveryPeriodInDays: 7
      DeletionProtectionEnabled: true
      StreamSpecification:
        StreamViewType: KEYS_ONLY

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/opda-working-group-interest
      RetentionInDays: 30

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opda-working-group-interest
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: working-group-interest-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FunctionLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/opda-working-group-interest:*'
              - Sid: RegistrationRecords
                Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt RegistrationsTable.Arn

  Function:
    Type: AWS::Serverless::Function
    DependsOn: FunctionLogGroup
    Properties:
      FunctionName: opda-working-group-interest
      CodeUri: working-group-interest/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Role: !GetAtt FunctionRole.Arn
      Environment:
        Variables:
          REGISTRATIONS_TABLE_NAME: !Ref RegistrationsTable

  Api:
    Type: AWS::ApiGatewayV2::Api
    Metadata:
      RequestBodyBoundaryBytes: 16384
      BoundaryEnforcement: Lambda handler (HTTP API has no per-route body-size control)
    Properties:
      Name: opda-working-group-interest
      Description: Same-origin public API for working-group expressions of interest
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 15000

  RegisterRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /api/working-group-interest
      Target: !Sub 'integrations/${Integration}'

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        DetailedMetricsEnabled: false
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/api/working-group-interest'

Outputs:
  ApiId:
    Value: !Ref Api
  ApiEndpoint:
    Value: !GetAtt Api.ApiEndpoint
  ApiOriginDomainName:
    Value: !Sub '${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionName:
    Value: !Ref Function
  RegistrationsTableName:
    Value: !Ref RegistrationsTable
  RegistrationsTableArn:
    Value: !GetAtt RegistrationsTable.Arn
  RegistrationsTableStreamArn:
    Value: !GetAtt RegistrationsTable.StreamArn
