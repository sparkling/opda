# Edge stack — opda.org.uk AWS hosting (ADR-0038 / ADR-0040 / ADR-0079)
#
# The us-east-1 stack contains the ACM certificate required by CloudFront's
# control plane. ADR-0079 removed the former Lambda@Edge authentication gate.
#
# CI creates this stack before the site on a new installation. On an existing
# gated installation it first reads CertificateArn, deploys the ungated site,
# then reconciles this certificate-only template (exports do not cross regions).
#
# Certificate validation note (cutover sequencing): the validation CNAME is
# written into the Route 53 hosted zone automatically, but until the registrar
# NS cutover Cloudflare is still authoritative — the same CNAME must be added
# there (DNS-only) for the first issuance to complete (ADR-0040 cutover).
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  opda.org.uk edge resource (us-east-1): CloudFront ACM certificate
  (ADR-0038/ADR-0040/ADR-0079).

Parameters:
  DomainName:
    Type: String
    Default: opda.org.uk
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone (from the opda-bootstrap stack outputs).

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
